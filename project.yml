name: MisparRechev
options:
  bundleIdPrefix: il.misparrechev
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: he
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_LANGUAGE: he
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
    INFOPLIST_KEY_CFBundleDisplayName: "מספר רכב"
    # Force right-to-left for consistent Hebrew layout (optional; system still
    # honours per-view layoutDirection). Comment out to follow device language.
    INFOPLIST_KEY_UIForceRTL: YES
    INFOPLIST_KEY_NSCameraUsageDescription: "המצלמה משמשת לסריקת לוחית הרישוי כדי למלא את מספר הרכב אוטומטית"

targets:
  MisparRechev:
    type: application
    platform: iOS
    sources:
      - path: Sources/MisparRechev
    resources:
      - path: Sources/MisparRechev/Resources
    # Generated by XcodeGen on every `xcodegen generate` (gitignored) — the
    # keys live HERE, never hand-edit the generated files.
    entitlements:
      path: Sources/MisparRechev/MisparRechev.entitlements
      properties:
        com.apple.security.application-groups:
          - group.il.misparrechev.shared
    info:
      path: Sources/MisparRechev/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        BGTaskSchedulerPermittedIdentifiers:
          - il.misparrechev.app.refresh
        UIBackgroundModes:
          - fetch
        CFBundleURLTypes:
          - CFBundleURLName: il.misparrechev.app
            CFBundleURLSchemes:
              - misparrechev
    dependencies:
      - target: MisparRechevWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: il.misparrechev.app
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_ALLOWED: YES
        ENABLE_PREVIEWS: YES

  # Home-screen widget ("הרכב שלי"). Shares exactly two Foundation-only files
  # with the app: MyCarStore.swift + PlateDates.swift — keep them free of
  # SwiftUI/model-layer imports.
  MisparRechevWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/MisparRechevWidgets
      - path: Sources/MisparRechev/Persistence/MyCarStore.swift
      - path: Sources/MisparRechev/Utilities/PlateDates.swift
    entitlements:
      path: Sources/MisparRechevWidgets/MisparRechevWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.il.misparrechev.shared
    info:
      path: Sources/MisparRechevWidgets/Info.plist
      properties:
        CFBundleDisplayName: "מספר רכב"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: il.misparrechev.app.widgets
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES

  MisparRechevTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/MisparRechevTests
    dependencies:
      - target: MisparRechev
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: il.misparrechev.tests
        GENERATE_INFOPLIST_FILE: YES